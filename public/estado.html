<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrono Sovereign Cloud — Transparencia</title>
<style>
  :root {
    --bg: #0a0f1a; --panel: #121a2b; --accent: #00d4aa; --accent-dim: #0a8a6f;
    --text: #e8edf5; --text-dim: #8a97ab; --border: #1f2b40;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 20px; }
  .wrap { max-width: 600px; margin: 0 auto; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  h1 { font-size: 1.4rem; font-weight: 600; }
  .subtitle { color: var(--text-dim); font-size: 0.88rem; margin: 8px 0 24px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat .num { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .section h2 { font-size: 0.95rem; margin-bottom: 12px; color: var(--accent); }
  .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--text-dim); }
  .row .v { text-align: right; max-width: 60%; }
  .updated { text-align: center; font-size: 0.72rem; color: var(--text-dim); margin-top: 10px; }
  footer { text-align: center; margin-top: 24px; font-size: 0.72rem; color: var(--text-dim); }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-row">
    <span class="dot"></span>
    <h1>Transparencia — Chrono Sovereign Cloud</h1>
  </div>
  <p class="subtitle">
    Sin letra chica. Esto es exactamente lo que sabemos y lo que hacemos con tus datos, en vivo.
  </p>

  <div class="grid" id="stats"></div>

  <div class="section">
    <h2>Política de datos</h2>
    <div id="policy"></div>
  </div>

  <div class="section">
    <h2>Límites reales de fase 1</h2>
    <div id="limits"></div>
  </div>

  <div class="updated" id="updated"></div>

  <footer>Chrono Shield Networks · Bogotá, Colombia</footer>
</div>

<script>
  const API_BASE = "http://localhost:4000";

  async function load() {
    try {
      const res = await fetch(`${API_BASE}/transparency`);
      const data = await res.json();

      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="num">${data.totalRegisteredSites}</div><div class="label">Sitios registrados</div></div>
        <div class="stat"><div class="num">${data.deployedSites}</div><div class="label">Sitios desplegados</div></div>
        <div class="stat"><div class="num">${data.totalFormSubmissions}</div><div class="label">Formularios recibidos</div></div>
        <div class="stat"><div class="num">100%</div><div class="label">Datos propios, sin terceros</div></div>
      `;

      document.getElementById("policy").innerHTML = `
        <div class="row"><span class="k">Ubicación de los datos</span><span class="v">${data.dataPolicy.dataLocation}</span></div>
        <div class="row"><span class="k">Acceso de terceros</span><span class="v">${data.dataPolicy.thirdPartyAccess}</span></div>
        <div class="row"><span class="k">Rastreo/Analytics</span><span class="v">${data.dataPolicy.analyticsTracking}</span></div>
        <div class="row"><span class="k">Borrado de datos</span><span class="v">${data.dataPolicy.deletion}</span></div>
      `;

      document.getElementById("limits").innerHTML = `
        <div class="row"><span class="k">RAM por sitio</span><span class="v">${data.limits.memory}</span></div>
        <div class="row"><span class="k">CPU por sitio</span><span class="v">${data.limits.cpus}</span></div>
        <div class="row"><span class="k">Almacenamiento máx.</span><span class="v">${data.limits.storageQuotaMB} MB</span></div>
      `;

      document.getElementById("updated").textContent =
        "Actualizado: " + new Date(data.generatedAt).toLocaleString("es-CO");
    } catch (err) {
      document.getElementById("stats").innerHTML = `<div class="section" style="grid-column:1/-1;color:#ff5d5d;">No se pudo conectar al servidor: ${err.message}</div>`;
    }
  }

  load();
  setInterval(load, 15000);
</script>

</body>
</html>
