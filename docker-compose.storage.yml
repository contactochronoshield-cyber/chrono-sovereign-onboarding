version: "3.8"

# Chrono Storage — Object Storage layer (MinIO, S3-compatible)
# Uso: docker compose -f docker-compose.storage.yml up -d

services:
  chrono-storage:
    image: minio/minio:latest
    container_name: chrono-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Consola web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chrono_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set en .env, minimo 8 caracteres}
    volumes:
      - chrono_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  chrono_storage_data:
    driver: local
